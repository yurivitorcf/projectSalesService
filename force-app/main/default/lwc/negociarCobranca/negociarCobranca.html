<template>
    <lightning-card title="Negociação de Cobrança" icon-name="standard:case">
        <div class="slds-p-horizontal_medium">
            <template if:true={parcelas.length}>
                <lightning-datatable
                    key-field="Id"
                    data={parcelas}
                    columns={columns}
                    onrowselection={handleRowSelection}>
                </lightning-datatable>

                <div class="slds-m-top_medium">
                    <lightning-button
                        variant="brand"
                        label="Quitar e Liberar"
                        onclick={handleQuitar}
                        disabled={botaoDesabilitado}>
                    </lightning-button>
                </div>
            </template>

            <template if:false={parcelas.length}>
                <p class="slds-text-color_weak">Nenhuma parcela em aberto para este cliente.</p>
            </template>
        </div>
    </lightning-card>
</template>
